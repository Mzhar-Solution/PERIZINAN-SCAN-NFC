<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem</title>
    <!-- Tambahkan CSS sederhana agar rapi -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3ecf8e; /* Warna khas Supabase */
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #34b27b;
        }
        .error-msg {
            color: red;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }
    </style>

    <!-- Panggil Library Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-card">
        <h2>Silakan Masuk</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit" id="btnSubmit">Masuk</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <script>
        // 1. Inisialisasi Koneksi Supabase 
        // (Ganti URL dan Anon Key dengan milik project Mzhar-Solution Anda)
        const SUPABASE_URL = 'https://alsjmuelqpocvipptoht.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsc2ptdWVscXBvY3ZpcHB0b2h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTk1ODksImV4cCI6MjEwNzEzNTU4OX0.6ZcAdLr-6ZWPdOVtRPj2w0hazZPkvzz7gd-MY8Bslfs';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Tangkap Event saat Tombol Submit / Masuk Ditekan
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah form reload halaman

            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btnSubmit = document.getElementById('btnSubmit');

            errorMsg.textContent = '';
            btnSubmit.textContent = 'Memeriksa...';
            btnSubmit.disabled = true;

            try {
                // 3. Cek data ke tabel `users` di database Supabase
                const { data, error } = await _supabase
                    .from('users')
                    .select('*')
                    .eq('username', userIn)
                    .eq('password', passIn)
                    .single();

                if (error || !data) {
                    throw new Error("Username atau password salah!");
                }

                // 4. Jika Login Berhasil: Simpan sesi di browser (LocalStorage)
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', data.username);
                localStorage.setItem('nama_lengkap', data.nama_lengkap);
                localStorage.setItem('role', data.role);

                alert("Login berhasil, Selamat datang " + data.nama_lengkap + "!");
                
                // Pindahkan ke halaman utama/dashboard (misal: index.html)
                window.location.href = 'index.html';

            } catch (err) {
                errorMsg.textContent = err.message;
                btnSubmit.textContent = 'Masuk';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Scan Izin NFC</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    button { background-color: #0070f3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; }
    #status { margin-top: 20px; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Scan Izin Keluar (NFC)</h2>
    <p>Tempelkan kartu/tag NFC ke bagian belakang HP kamu.</p>
    <button id="scanBtn">Mulai Scan NFC</button>
    <div id="status">Status: Siap scan...</div>
  </div>

  <script>
    const scanBtn = document.getElementById('scanBtn');
    const statusDiv = document.getElementById('status');

    scanBtn.addEventListener('click', async () => {
      if ('NDEFReader' in window) {
        try {
          const ndef = new NDEFReader();
          await ndef.scan();
          statusDiv.innerText = "Status: Dekatkan kartu NFC sekarang...";

          ndef.addEventListener("readingerror", () => {
            statusDiv.innerText = "Gagal membaca tag NFC!";
          });

          ndef.addEventListener("reading", ({ message, serialNumber }) => {
            statusDiv.innerHTML = `<span style="color:green">Berhasil!</span><br>ID Kartu: ${serialNumber}`;
          });
        } catch (error) {
          statusDiv.innerText = "Error: " + error;
        }
      } else {
        statusDiv.innerText = "Fitur NFC tidak didukung di browser ini. Pastikan memakai Chrome di Android dengan NFC aktif.";
      }
    });
  </script>

</body>
</html>

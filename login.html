<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Perizinan Santri NFC</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6f9;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
  .login-card{background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.1);width:100%;max-width:350px}
  .login-card h2{margin:0 0 20px;color:#333;text-align:center}
  .form-group{margin-bottom:15px}
  .form-group label{display:block;margin-bottom:5px;color:#666;font-size:14px}
  .form-group input{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
  button{width:100%;padding:10px;background:#3ecf8e;border:none;color:#fff;font-weight:bold;border-radius:4px;cursor:pointer}
  button:hover{background:#34b27b}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{font-size:13px;text-align:center;margin-top:10px;min-height:18px}
  .msg.err{color:#dc2626}
  .msg.info{color:#b45309}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="login-card">
  <h2>Silakan Masuk</h2>
  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" placeholder="Masukkan email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="Masukkan password">
    </div>
    <button type="submit" id="btnSubmit">Masuk</button>
    <div id="msg" class="msg"></div>
  </form>
</div>

<script>
const SUPABASE_URL = 'https://alsjmuelqpocvipptoht.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsc2ptdWVscXBvY3ZpcHB0b2h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTk1ODksImV4cCI6MjEwNzEzNTU4OX0.6ZcAdLr-6ZWPdOVtRPj2w0hazZPkvzz7gd-MY8Bslfs';
const APP_PAGE = 'index.html';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
const $ = id => document.getElementById(id);
const setMsg = (t, cls) => { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (cls || ''); };

// Pesan dari index.html (mis. sesi habis / logout)
try {
  const m = sessionStorage.getItem('loginMsg');
  if (m) { setMsg(m, 'info'); sessionStorage.removeItem('loginMsg'); }
} catch (e) {}

// Jika sesi masih valid, langsung ke aplikasi
db.auth.getSession().then(({ data }) => {
  if (data && data.session) location.replace(APP_PAGE);
}).catch(() => {});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('btnSubmit');
  setMsg('');
  btn.textContent = 'Memeriksa...'; btn.disabled = true;
  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });
    if (error || !data.session) throw error || new Error('Login gagal');
    location.replace(APP_PAGE);
  } catch (err) {
    const raw = String((err && err.message) || '');
    setMsg(/invalid login/i.test(raw) ? 'Email atau password salah!' :
           /email not confirmed/i.test(raw) ? 'Email belum dikonfirmasi.' :
           /fetch|network/i.test(raw) ? 'Tidak dapat terhubung ke server.' : 'Login gagal: ' + raw, 'err');
    btn.textContent = 'Masuk'; btn.disabled = false;
  }
});
</script>
</body>
</html>
